name: Verify component

on:
  pull_request:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22 (Node 24)

      - name: Validate release metadata and wiki inputs
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < version.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          wit_version="$(sed -nE 's/^package gams:director-compiler@([0-9]+\.[0-9]+\.[0-9]+);$/\1/p' wit/package.wit)"
          [[ "$wit_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -s LICENSE
          test -s NOTICE
          test -f docs/_config.md
          test -f docs/_sidebar.md
          test -f docs/index.md
          test -f docs/language.md
          test "$(head -n 1 docs/index.md)" = '---'
          test "$(head -n 1 docs/language.md)" = '---'
          if grep -RE '(\.\./|docs/prd/|examples/|plugins/)' docs; then
            echo 'Extracted documentation contains a source-repository link.' >&2
            exit 1
          fi
          printf 'Distribution %s; WIT %s\n' "$version" "$wit_version"

      - name: Test distribution and publication safety gates
        run: |
          bash scripts/test-artifact-approval.sh
          bash scripts/test-release-absent.sh
          bash scripts/test-release-oci-preflight.sh

      - name: Test
        run: nix develop --command make test

      - name: Build
        run: nix develop --command make build

      - name: Record build evidence
        run: nix develop --command ./scripts/record-build-evidence.sh dist/evidence

      - name: Print Linux provenance without distributing linked binaries
        shell: bash
        run: |
          set -euo pipefail
          cat dist/evidence/wasi-sdk-VERSION dist/evidence/tool-versions.txt dist/evidence/artifact-sha256.txt
          grep -E 'crt1-reactor|libc[.]a|libclang_rt' dist/evidence/director-compiler.link.map
          for metadata in dist/evidence/module-metadata/*.json; do
            echo "Module: $metadata"
            cat "$metadata"
          done

      - name: Verify and checksum component artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/director-compiler.wasm
          python3 scripts/wasm-notices.py verify dist/director-compiler.wasm --license LICENSE --notice NOTICE
          (cd dist && sha256sum director-compiler.wasm > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)

      # Downloadable Actions artifacts are distribution. A successful build
      # alone does not authorize uploading the WASM or link evidence.
      - name: Gate exact licensing bytes and stage CI candidate
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/release' && vars.DIRECTOR_COMPILER_ARTIFACT_UPLOAD_APPROVED == 'true'
        env:
          APPROVED: ${{ vars.DIRECTOR_COMPILER_ARTIFACT_UPLOAD_APPROVED }}
          APPROVED_LICENSE_SHA256: ${{ vars.DIRECTOR_COMPILER_LICENSE_SHA256 }}
          APPROVED_NOTICE_SHA256: ${{ vars.DIRECTOR_COMPILER_NOTICE_SHA256 }}
        run: bash scripts/check-artifact-approval.sh

      - name: Upload owner-approved candidate and evidence (not a release)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/release' && vars.DIRECTOR_COMPILER_ARTIFACT_UPLOAD_APPROVED == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node 24)
        with:
          name: director-compiler-verification-${{ github.sha }}
          path: |
            dist/director-compiler.wasm
            dist/LICENSE
            dist/NOTICE
            dist/SHA256SUMS
            dist/evidence/
          if-no-files-found: error
          retention-days: 7
