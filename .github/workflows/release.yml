name: Release component

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)

      - name: Enforce release metadata and licensing gates before build
        id: metadata
        shell: bash
        env:
          LICENSE_APPROVED: ${{ vars.DIRECTOR_COMPILER_LICENSE_APPROVED }}
          APPROVED_LICENSE_SHA256: ${{ vars.LICENSE_SHA256 }}
          APPROVED_NOTICE_SHA256: ${{ vars.NOTICE_SHA256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = kkgams/plugin.director-compiler
          version="$(tr -d '[:space:]' < version.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF" = "refs/tags/v${version}"
          else
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF_TYPE" = branch
          fi
          wit_version="$(sed -nE 's/^package gams:director-compiler@([0-9]+\.[0-9]+\.[0-9]+);$/\1/p' wit/package.wit)"
          [[ "$wit_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f docs/_config.md
          test -f docs/_sidebar.md
          test "$(head -n 1 docs/index.md)" = '---'
          test "$(head -n 1 docs/language.md)" = '---'
          if grep -RE '(\.\./|docs/prd/|examples/|plugins/)' docs; then
            echo 'Extracted documentation contains a source-repository link.' >&2
            exit 1
          fi

          if [[ ! -s LICENSE ]]; then
            echo 'Publication blocked before build: root LICENSE is missing or empty.' >&2
            exit 1
          fi
          if [[ ! -s NOTICE ]]; then
            echo 'Publication blocked before build: root NOTICE is missing or empty.' >&2
            exit 1
          fi
          if [[ "$LICENSE_APPROVED" != true ]]; then
            echo 'Publication blocked before build: repository variable DIRECTOR_COMPILER_LICENSE_APPROVED must be exactly true.' >&2
            exit 1
          fi
          if [[ -z "$APPROVED_LICENSE_SHA256" ]]; then
            echo 'Publication blocked before build: repository variable LICENSE_SHA256 is missing.' >&2
            exit 1
          fi
          if [[ ! "$APPROVED_LICENSE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Publication blocked before build: repository variable LICENSE_SHA256 must be a lowercase SHA-256 digest.' >&2
            exit 1
          fi
          if [[ -z "$APPROVED_NOTICE_SHA256" ]]; then
            echo 'Publication blocked before build: repository variable NOTICE_SHA256 is missing.' >&2
            exit 1
          fi
          if [[ ! "$APPROVED_NOTICE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Publication blocked before build: repository variable NOTICE_SHA256 must be a lowercase SHA-256 digest.' >&2
            exit 1
          fi
          license_sha256="$(sha256sum LICENSE | awk '{print $1}')"
          notice_sha256="$(sha256sum NOTICE | awk '{print $1}')"
          if [[ "$license_sha256" != "$APPROVED_LICENSE_SHA256" ]]; then
            echo "Publication blocked before build: LICENSE digest $license_sha256 does not match LICENSE_SHA256." >&2
            exit 1
          fi
          if [[ "$notice_sha256" != "$APPROVED_NOTICE_SHA256" ]]; then
            echo "Publication blocked before build: NOTICE digest $notice_sha256 does not match NOTICE_SHA256." >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "wit_version=$wit_version"
            echo "license_sha256=$license_sha256"
            echo "notice_sha256=$notice_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22 (Node 24)

      - name: Cache pinned Nix toolchain
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7 (Node 24)
        with:
          primary-key: director-linux-nix-${{ hashFiles('flake.nix', 'flake.lock') }}
          save: ${{ github.ref == 'refs/heads/release' }}

      - name: Cache npm downloads
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3 (Node 24)
        with:
          path: ~/.npm
          key: director-linux-npm-${{ hashFiles('package-lock.json') }}

      - name: Test release safety scripts
        run: |
          bash scripts/test-artifact-approval.sh
          bash scripts/test-release-absent.sh
          bash scripts/test-release-oci-preflight.sh

      - name: Verify the Linux publishing toolchain without publishing
        run: nix develop --command wkg --version

      - name: Test before build
        run: nix develop --command make test

      - name: Record build evidence
        run: nix develop --command ./scripts/record-build-evidence.sh dist/evidence

      - name: Stage and checksum exact licensed component
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/director-compiler.wasm
          python3 scripts/wasm-notices.py verify dist/director-compiler.wasm --license LICENSE --notice NOTICE
          cp LICENSE NOTICE dist/
          (cd dist && sha256sum director-compiler.wasm LICENSE NOTICE > SHA256SUMS && sha256sum --check SHA256SUMS)

      - name: Upload verified release candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node 24)
        with:
          name: director-compiler-${{ steps.metadata.outputs.version }}
          path: |
            dist/director-compiler.wasm
            dist/LICENSE
            dist/NOTICE
            dist/SHA256SUMS
            dist/evidence/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)

      - name: Enforce version, ref, and licensing gates
        id: metadata
        shell: bash
        env:
          LICENSE_APPROVED: ${{ vars.DIRECTOR_COMPILER_LICENSE_APPROVED }}
          APPROVED_LICENSE_SHA256: ${{ vars.LICENSE_SHA256 }}
          APPROVED_NOTICE_SHA256: ${{ vars.NOTICE_SHA256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = kkgams/plugin.director-compiler
          version="$(tr -d '[:space:]' < version.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF" = "refs/tags/v${version}"

          wit_version="$(sed -nE 's/^package gams:director-compiler@([0-9]+\.[0-9]+\.[0-9]+);$/\1/p' wit/package.wit)"
          [[ "$wit_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          if [[ ! -s LICENSE ]]; then
            echo 'Publication blocked: root LICENSE is missing or empty.' >&2
            exit 1
          fi
          if [[ ! -s NOTICE ]]; then
            echo 'Publication blocked: root NOTICE is missing or empty.' >&2
            exit 1
          fi
          if [[ "$LICENSE_APPROVED" != true ]]; then
            echo 'Publication blocked: repository variable DIRECTOR_COMPILER_LICENSE_APPROVED must be exactly true.' >&2
            exit 1
          fi
          if [[ -z "$APPROVED_LICENSE_SHA256" ]]; then
            echo 'Publication blocked: repository variable LICENSE_SHA256 is missing.' >&2
            exit 1
          fi
          if [[ ! "$APPROVED_LICENSE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Publication blocked: repository variable LICENSE_SHA256 must be a lowercase SHA-256 digest.' >&2
            exit 1
          fi
          if [[ -z "$APPROVED_NOTICE_SHA256" ]]; then
            echo 'Publication blocked: repository variable NOTICE_SHA256 is missing.' >&2
            exit 1
          fi
          if [[ ! "$APPROVED_NOTICE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Publication blocked: repository variable NOTICE_SHA256 must be a lowercase SHA-256 digest.' >&2
            exit 1
          fi
          license_sha256="$(sha256sum LICENSE | awk '{print $1}')"
          notice_sha256="$(sha256sum NOTICE | awk '{print $1}')"
          if [[ "$license_sha256" != "$APPROVED_LICENSE_SHA256" ]]; then
            echo "Publication blocked: LICENSE digest $license_sha256 does not match LICENSE_SHA256." >&2
            exit 1
          fi
          if [[ "$notice_sha256" != "$APPROVED_NOTICE_SHA256" ]]; then
            echo "Publication blocked: NOTICE digest $notice_sha256 does not match NOTICE_SHA256." >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "wit_version=$wit_version"
            echo "license_sha256=$license_sha256"
            echo "notice_sha256=$notice_sha256"
            echo "oci_ref=ghcr.io/kkgams/gams/director-compiler:${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse an existing GitHub Release (only 404 is absence)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-release-absent.sh

      - name: Download verified release candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0 (Node 24)
        with:
          name: director-compiler-${{ steps.metadata.outputs.version }}
          path: dist

      - name: Recheck downloaded artifact and stage licensing assets
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          cmp dist/LICENSE LICENSE
          cmp dist/NOTICE NOTICE
          python3 scripts/wasm-notices.py verify dist/director-compiler.wasm \
            --license LICENSE --notice NOTICE
          cp LICENSE NOTICE dist/
          (cd dist && sha256sum director-compiler.wasm LICENSE NOTICE > SHA256SUMS && sha256sum --check SHA256SUMS)

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22 (Node 24)

      - name: Restore pinned Nix publishing tools
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7 (Node 24)
        with:
          primary-key: director-linux-nix-${{ hashFiles('flake.nix', 'flake.lock') }}
          save: 'false'

      - name: Authenticate to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0 (Node 24)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the exact OCI version may be pushed
        id: oci_preflight
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCI_REF: ${{ steps.metadata.outputs.oci_ref }}
        run: nix develop --command ./scripts/release-oci-preflight.sh "$OCI_REF" dist/director-compiler.wasm

      - name: Publish exact version to GHCR
        if: steps.oci_preflight.outputs.should_push == 'true'
        run: nix develop --command wkg oci push "${{ steps.metadata.outputs.oci_ref }}" dist/director-compiler.wasm

      - name: Create checksummed GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          WIT_VERSION: ${{ steps.metadata.outputs.wit_version }}
          OCI_REF: ${{ steps.metadata.outputs.oci_ref }}
          LICENSE_SHA256: ${{ steps.metadata.outputs.license_sha256 }}
          NOTICE_SHA256: ${{ steps.metadata.outputs.notice_sha256 }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Director Compiler pilot distribution **${VERSION}** exposes WIT package **gams:director-compiler@${WIT_VERSION}**.

          OCI artifact: \`${OCI_REF}\`
          Owner-approved LICENSE SHA-256: \`${LICENSE_SHA256}\`
          Owner-approved NOTICE SHA-256: \`${NOTICE_SHA256}\`

          This pilot does not implement every accepted Director language v1 feature. See the released language documentation for the exact implementation status, including structured value paths, nested matcher link values, matcher continuations, declaration/rule interleaving, and complete diagnostic recovery.
          EOF
          release_assets=(dist/director-compiler.wasm dist/LICENSE dist/NOTICE dist/SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --latest=false \
            --title "Director Compiler ${VERSION}" \
            --notes-file release-notes.md \
            "${release_assets[@]}"

  deploy-docs:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
